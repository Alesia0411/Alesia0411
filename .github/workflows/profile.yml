name: Build profile

on:
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'
  pull_request:
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test components and configuration
        run: python -m unittest discover -s tests -v
      - name: Build profile
        run: python scripts/build_profile.py
      - name: Verify deterministic output
        run: python scripts/build_profile.py --check

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_profile.py
      - name: Commit generated profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/generated assets/avatar.svg preview/index.html
          if git diff --cached --quiet; then
            echo 'Profile is already up to date.'
          else
            git commit -m 'chore: regenerate traveler profile'
            git push
          fi
